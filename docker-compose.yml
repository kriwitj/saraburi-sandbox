services:
  db:
    image: postgres:16-alpine
    container_name: saraburi_sandbox_db
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-saraburi_sandbox}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-saraburi_sandbox_secret}
    volumes:
      - saraburi_sandbox_pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-saraburi_sandbox}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saraburi_sandbox_backend
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-saraburi_sandbox_secret}@saraburi_sandbox_db:5432/${POSTGRES_DB:-saraburi_sandbox}
      - PGHOST=saraburi_sandbox_db
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-postgres}
      - PGPASSWORD=${POSTGRES_PASSWORD:-saraburi_sandbox_secret}
      - PGDATABASE=${POSTGRES_DB:-saraburi_sandbox}
    volumes:
      - ./backend/data_store.json:/app/data_store.json
    networks:
      internal:
        aliases:
          - saraburi_sandbox_backend
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saraburi_sandbox_frontend
    ports:
      - "3000:80" # Maps local port 3000 for offline testing
    networks:
      - proxy_net
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      # Router for frontend served via Nginx (port 80 inside container)
      - "traefik.http.routers.saraburi-sandbox.rule=Host(`${APP_DOMAIN:-saraburi-sandbox.saraburidev.org}`) || Host(`www.${APP_DOMAIN:-saraburi-sandbox.saraburidev.org}`)"
      - "traefik.http.routers.saraburi-sandbox.entrypoints=websecure"
      - "traefik.http.routers.saraburi-sandbox.tls=true"
      - "traefik.http.routers.saraburi-sandbox.tls.certresolver=letsencrypt"
      - "traefik.http.services.saraburi-sandbox.loadbalancer.server.port=80"
      # Middleware to redirect www to non-www
      - "traefik.http.middlewares.saraburi-sandbox-www-redirect.redirectregex.regex=^https://www\\.${APP_DOMAIN:-saraburi-sandbox.saraburidev.org}/(.*)"
      - "traefik.http.middlewares.saraburi-sandbox-www-redirect.redirectregex.replacement=https://${APP_DOMAIN:-saraburi-sandbox.saraburidev.org}/$${1}"
      - "traefik.http.routers.saraburi-sandbox.middlewares=saraburi-sandbox-www-redirect"
    depends_on:
      - backend
    restart: always

networks:
  proxy_net:
    external: true
  internal:
    driver: bridge

volumes:
  saraburi_sandbox_pgdata:
    name: saraburi_sandbox_pgdata
